<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShareLiving ist umgezogen</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            min-height: 100svh;
            place-items: center;
            margin: 0;
            padding: 1rem;
            background: #f4f7fb;
            color: #16202b;
            font: 1rem/1.6 system-ui, sans-serif;
        }

        main {
            width: min(100%, 38rem);
            padding: clamp(1.5rem, 6vw, 3.5rem);
            border: 1px solid #d9e2ec;
            border-radius: 1.125rem;
            background: #fff;
            box-shadow: 0 10px 30px rgb(15 23 42 / 8%);
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.75rem, 6vw, 2.75rem);
            line-height: 1.15;
            letter-spacing: -0.035em;
            text-wrap: balance;
        }

        p {
            margin: 1rem 0 1.75rem;
            color: #46586a;
            text-wrap: pretty;
        }

        a {
            display: inline-block;
            padding: 0.75rem 1.25rem;
            border-radius: 0.625rem;
            background: #2563eb;
            color: #fff;
            font-weight: 650;
            text-decoration: none;
        }

        a:hover {
            background: #1d4ed8;
        }

        a:focus-visible {
            outline: 3px solid #1d4ed8;
            outline-offset: 4px;
        }
    </style>
</head>
<body>
    <main>
        <h1>ShareLiving ist umgezogen</h1>
        <p>Unsere WG-App ist ab sofort unter einer neuen Adresse erreichbar.</p>
        <a href="https://www.dihei.org/wg-app/">Zur neuen WG-App <span aria-hidden="true">→</span></a>
    </main>
</body>
</html>
