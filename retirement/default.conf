server {
    listen 8080;
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {}

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        return 404;
    }
}
